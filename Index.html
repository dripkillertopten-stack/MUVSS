<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUVSS - Report Card System</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#f0f6ff;color:#0f172a}
.header{background:#0b3d91;color:#fff;padding:18px;text-align:center}
.card{max-width:560px;margin:18px auto;background:#fff;padding:18px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#0b3d91;color:#fff;font-size:16px;font-weight:700;margin-top:10px}
input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:8px}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:0">MUVSS</h2>
<p>Migyera United Volunteer Schools - Report Cards</p>
</div>
<div class="card" id="app">
<h3>Staff Login</h3>
<input id="pin" placeholder="Enter PIN - try 1234">
<button class="btn" onclick="login()">Login</button>
<p id="msg" style="color:red"></p>
</div>
<script>
function login(){
 if(document.getElementById('pin').value!==''){ 
  document.getElementById('app').innerHTML='<h3>Welcome</h3><label>Student Name</label><input placeholder="e.g. John Okello"><label>Class</label><select><option>S1</option><option>S2</option><option>S3</option><option>S4</option></select><label>Math</label><input placeholder="Mark"><label>English</label><input placeholder="Mark"><button class="btn" onclick="alert(`Saved Offline!`)">Save Report Offline</button>';
 } else { document.getElementById('msg').innerText='Enter PIN';}
}
</script>
</body>
</html>
